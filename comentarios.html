
<!DOCTYPE html>
 <html lang="pt-br">
	 <head> 
		<meta charset="UTF-8"> 
		<meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Formulários em HTML</title> <!-- Arquivo CSS externo --> 
		<link rel="stylesheet" href="script/stilo.css"> <!-- Font Awesome --> 
		<script src="https://kit.fontawesome.com/412e60f1c7.js" crossorigin="anonymous">
		</script> 
	</head> 
	<body> 
		<form action="" method="post"> 
			
			<div id="container"> 
				<h1>DEIXE SEU COMENTÁRIO</h1> 
				<label for="nome">Nome:</label> 
				<input type="text" id="nome" name="nome" size="30" maxlength="100" required > 
				<label for="email">E-mail:</label> 
				<input type="email" id="email" name="email" size="30" maxlength="100" required > 
				<label for="comentarios"> Comentários sobre sua satisfação pessoal: </label> 
				<textarea id="comentarios" name="comentarios" cols="50" rows="10" placeholder="Digite seu comentário..." >
				</textarea> 
				
				<div class="checkbox"> 
					<input type="checkbox" id="receber_info" name="receber_info" checked > 
					<label for="receber_info"> Desejo receber notificações promocionais </label> 
				</div> 
				<div class="botoes"> 
					<input type="submit" value="Enviar formulário">
					<br>
					<br> 
					<input type="reset" value="Apagar tudo"> 
				</div> 
			</div> 
		</form> 
		<a href="index.html" class="botao-principal"> <i class="fa-solid fa-house"></i> Página Principal </a> 
	</body> 
</html>
